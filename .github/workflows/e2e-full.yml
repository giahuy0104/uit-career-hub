name: Playwright full E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 6"

permissions:
  contents: read

concurrency:
  group: playwright-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-e2e:
    name: Happy flow and critical branches
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://uit_user:uit_ci_password@127.0.0.1:5432/uit_career_hub_ci
      DATABASE_URL_DIRECT: postgresql://uit_user:uit_ci_password@127.0.0.1:5432/uit_career_hub_ci
      DATABASE_URL_TEST: postgresql://uit_user:uit_ci_password@127.0.0.1:5432/uit_career_hub_ci
      DATABASE_URL_E2E: postgresql://uit_user:uit_ci_password@127.0.0.1:5432/uit_career_hub_e2e
      ALLOW_E2E_RESET: "true"
      DATABASE_POOL_MAX: 5

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uit_user
          POSTGRES_PASSWORD: uit_ci_password
          POSTGRES_DB: uit_career_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uit_user -d uit_career_hub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.16.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Spring Boot backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Create isolated E2E database
        env:
          PGPASSWORD: uit_ci_password
        run: psql -h 127.0.0.1 -U uit_user -d postgres -c "CREATE DATABASE uit_career_hub_e2e"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full Playwright suite
        run: pnpm e2e:full

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
