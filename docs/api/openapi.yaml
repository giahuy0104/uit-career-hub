  /cron/daily-pending-notifications:
    get:
      tags: [Scheduler]
      operationId: runDailyPendingNotifications
      summary: Tổng hợp hồ sơ còn chờ UIT/doanh nghiệp xử lý
      description: |
        Vercel Cron gọi một lần mỗi ngày. Request lặp lại trong cùng ngày không tạo
        thông báo trùng nhờ dedupe key theo ngày và người nhận. Sau khi tạo in-app
        notification, hệ thống xử lý email đang chờ và retry các lần gửi lỗi đến hạn.
      security:
        - cronBearerAuth: []
      responses:
        '200':
          description: Đã quét hàng đợi, tạo notification và xử lý email cần thiết
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - summaryDate
                      - uitPendingCount
                      - companyPendingCount
                      - companyCount
                      - uitRecipientCount
                      - companyRecipientCount
                      - notificationsCreated
                      - emailDelivery
                    properties:
                      summaryDate: { type: string, format: date }
                      uitPendingCount: { type: integer, minimum: 0 }
                      companyPendingCount: { type: integer, minimum: 0 }
                      companyCount: { type: integer, minimum: 0 }
                      uitRecipientCount: { type: integer, minimum: 0 }
                      companyRecipientCount: { type: integer, minimum: 0 }
                      notificationsCreated: { type: integer, minimum: 0 }
                      emailDelivery:
                        type: object
                        required: [enabled, claimed, sent, failed]
                        properties:
                          enabled: { type: boolean }
                          claimed: { type: integer, minimum: 0 }
                          sent: { type: integer, minimum: 0 }
                          failed: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CRON_SECRET
    refreshCookie:
      type: apiKey
      in: cookie
      name: uit_refresh_token

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationDocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InterviewId:
      name: interviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Chưa xác thực hoặc phiên hết hạn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Không có quyền thực hiện
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Không tìm thấy hoặc không được phép biết tài nguyên tồn tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Trùng lặp, idempotency conflict hoặc transition không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Locked:
      description: Tài khoản đang bị khóa tạm thời
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Quá nhiều yêu cầu xác thực
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Tích hợp hạ tầng cần thiết chưa được cấu hình hoặc tạm thời không khả dụng
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    UserRole:
      type: string
      enum: [STUDENT, UIT_ADMIN, COMPANY]
    UserStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, SUSPENDED, LOCKED]
    JobStatus:
      type: string
      enum: [DRAFT, PENDING_UIT_REVIEW, REVISION_REQUIRED, RECRUITING, PAUSED, EXPIRED, REJECTED, CLOSED]
    ApplicationStatus:
      type: string
      enum:
        - UIT_REVIEWING
        - NEEDS_SUPPLEMENT
        - FORWARDED_TO_COMPANY
        - COMPANY_REVIEWING
        - INTERVIEW_INVITED
        - NOT_SUITABLE
        - INTERVIEW_FAILED
        - OFFER_PENDING_STUDENT
        - ACCEPTED_PENDING_UIT_CONFIRMATION
        - HIRED
        - OFFER_DECLINED
        - UIT_REJECTED
        - WITHDRAWN
    WorkMode:
      type: string
      enum: [ONSITE, REMOTE, HYBRID]
    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            traceId: { type: string }
    User:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        displayName: { type: [string, 'null'] }
        organization: { type: [string, 'null'] }
        studentProfileId: { type: [string, 'null'], format: uuid }
        companyId: { type: [string, 'null'], format: uuid }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    CompanyActivationRequest:
      type: object
      required: [token, password, acceptedTerms]
      properties:
        token: { type: string, minLength: 32 }
        password: { type: string, minLength: 8, maxLength: 128 }
        acceptedTerms: { type: boolean, const: true }
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, expiresIn, user]
          properties:
            accessToken: { type: string }
            expiresIn: { type: integer, minimum: 1 }
            user: { $ref: '#/components/schemas/User' }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    StudentProfile:
      type: object
      required: [id, studentCode, fullName, faculty, major, cohort, academicStatus, email]
      properties:
        id: { type: string, format: uuid }
        studentCode: { type: string }
        fullName: { type: string }
        faculty: { type: string }
        major: { type: string }
        cohort: { type: string }
        gpa: { type: [number, 'null'], minimum: 0, maximum: 4 }
        phone: { type: [string, 'null'] }
        academicStatus: { type: string, enum: [ACTIVE, SUSPENDED, GRADUATED, INACTIVE] }
        email: { type: string, format: email }
    StudentProfileUpdateRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone: { type: [string, 'null'], minLength: 8, maxLength: 30 }
    StudentProfileEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StudentProfile' }
    StudentDocument:
      type: object
      required: [id, documentType, fileName, mimeType, fileSizeBytes, version, isDefault, verificationStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentType: { type: string, enum: [CV, TRANSCRIPT, STUDENT_CONFIRMATION, OTHER] }
        fileName: { type: string }
        mimeType: { type: string }
        fileSizeBytes: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        isDefault: { type: boolean }
        verificationStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        createdAt: { type: string, format: date-time }
    StudentDocumentListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StudentDocument' }
    UitStudentDocument:
      allOf:
        - $ref: '#/components/schemas/StudentDocument'
        - type: object
          required: [student]
          properties:
            student:
              type: object
              required: [id, studentCode, fullName, email, faculty, major]
              properties:
                id: { type: string, format: uuid }
                studentCode: { type: string }
                fullName: { type: string }
                email: { type: string, format: email }
                faculty: { type: string }
                major: { type: string }
    UitStudentDocumentListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UitStudentDocument' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    StudentDocumentReviewRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: { type: string, const: VERIFY }
            note: { type: string, maxLength: 2000 }
        - type: object
          additionalProperties: false
          required: [decision, note]
          properties:
            decision: { type: string, const: REJECT }
            note: { type: string, minLength: 5, maxLength: 2000 }
    StudentDocumentUploadRequest:
      type: object
      additionalProperties: false
      required: [documentType, fileName, mimeType, fileSizeBytes]
      properties:
        documentType: { type: string, enum: [CV, TRANSCRIPT, STUDENT_CONFIRMATION, OTHER] }
        fileName: { type: string, minLength: 1, maxLength: 255, pattern: '\\.[pP][dD][fF]$' }
        mimeType: { type: string, const: application/pdf }
        fileSizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
    StudentDocumentUploadIntentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uploadId, uploadUrl, method, headers, expiresAt]
          properties:
            uploadId: { type: string, format: uuid }
            uploadUrl: { type: string, format: uri }
            method: { type: string, const: PUT }
            headers:
              type: object
              required: [Content-Type]
              properties:
                Content-Type: { type: string, const: application/pdf }
            expiresAt: { type: string, format: date-time }
    StudentDocumentDownloadEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [downloadUrl, expiresAt]
          properties:
            downloadUrl: { type: string, format: uri }
            expiresAt: { type: string, format: date-time }
    DashboardMetricValue:
      type: integer
      minimum: 0
    StudentDashboardEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [metrics, profile, tasks, latestApplication, opportunities]
          properties:
            metrics:
              type: object
              required: [profileCompleteness, activeApplications, upcomingInterviews, pendingOffers]
              properties:
                profileCompleteness: { type: integer, minimum: 0, maximum: 100 }
                activeApplications: { $ref: '#/components/schemas/DashboardMetricValue' }
                upcomingInterviews: { $ref: '#/components/schemas/DashboardMetricValue' }
                pendingOffers: { $ref: '#/components/schemas/DashboardMetricValue' }
            profile:
              type: object
              required: [missingItems]
              properties:
                missingItems: { type: array, items: { type: string } }
            tasks:
              type: array
              items:
                type: object
                required: [type, applicationId, title, description, dueAt]
                properties:
                  type: { type: string, enum: [SUPPLEMENT_DOCUMENTS, RESPOND_OFFER, UPCOMING_INTERVIEW] }
                  applicationId: { type: string, format: uuid }
                  title: { type: string }
                  description: { type: string }
                  dueAt: { type: [string, 'null'], format: date-time }
            latestApplication:
              type: [object, 'null']
              required: [applicationId, status, jobTitle, companyName, lastTransitionAt]
              properties:
                applicationId: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/ApplicationStatus' }
                jobTitle: { type: string }
                companyName: { type: string }
                lastTransitionAt: { type: string, format: date-time }
            opportunities:
              type: array
              items:
                type: object
                required: [jobId, title, companyName, workMode, deadline]
                properties:
                  jobId: { type: string, format: uuid }
                  title: { type: string }
                  companyName: { type: string }
                  workMode: { $ref: '#/components/schemas/WorkMode' }
                  deadline: { type: string, format: date }
    AdminDashboardEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [metrics, queues, handledToday, applicationFunnel, topCompanies]
          properties:
            metrics:
              type: object
              required: [pendingJobReviews, pendingUitApplications, awaitingCompany, hiresThisMonth]
              properties:
                pendingJobReviews: { $ref: '#/components/schemas/DashboardMetricValue' }
                pendingUitApplications: { $ref: '#/components/schemas/DashboardMetricValue' }
                awaitingCompany: { $ref: '#/components/schemas/DashboardMetricValue' }
                hiresThisMonth: { $ref: '#/components/schemas/DashboardMetricValue' }
            queues:
              type: object
              required: [uitApplications, jobReviews, placementConfirmations]
              properties:
                uitApplications: { $ref: '#/components/schemas/DashboardQueue' }
                jobReviews:
                  allOf:
                    - { $ref: '#/components/schemas/DashboardQueue' }
                    - type: object
                      required: [companyCount]
                      properties:
                        companyCount: { $ref: '#/components/schemas/DashboardMetricValue' }
                placementConfirmations: { $ref: '#/components/schemas/DashboardQueue' }
            handledToday:
              type: object
              required: [completed, incoming, completionRate]
              properties:
                completed: { $ref: '#/components/schemas/DashboardMetricValue' }
                incoming: { $ref: '#/components/schemas/DashboardMetricValue' }
                completionRate: { type: integer, minimum: 0, maximum: 100 }
            applicationFunnel:
              type: array
              items:
                type: object
                required: [status, count]
                properties:
                  status: { type: string }
                  count: { $ref: '#/components/schemas/DashboardMetricValue' }
            topCompanies:
              type: array
              items:
                type: object
                required: [companyId, companyName, recruitingJobs, applications]
                properties:
                  companyId: { type: string, format: uuid }
                  companyName: { type: string }
                  recruitingJobs: { $ref: '#/components/schemas/DashboardMetricValue' }
                  applications: { $ref: '#/components/schemas/DashboardMetricValue' }
    DashboardQueue:
      type: object
      required: [total, overdue, oldestWaitingHours]
      properties:
        total: { $ref: '#/components/schemas/DashboardMetricValue' }
        overdue: { $ref: '#/components/schemas/DashboardMetricValue' }
        oldestWaitingHours: { type: [integer, 'null'], minimum: 0 }
    CompanyDashboardEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [metrics, actionQueue, recentCandidates, jobPerformance]
          properties:
            metrics:
              type: object
              required: [recruitingJobs, pendingJobReviews, newCandidates, interviewsThisWeek, hiresThisMonth]
              properties:
                recruitingJobs: { $ref: '#/components/schemas/DashboardMetricValue' }
                pendingJobReviews: { $ref: '#/components/schemas/DashboardMetricValue' }
                newCandidates: { $ref: '#/components/schemas/DashboardMetricValue' }
                interviewsThisWeek: { $ref: '#/components/schemas/DashboardMetricValue' }
                hiresThisMonth: { $ref: '#/components/schemas/DashboardMetricValue' }
            actionQueue:
              type: object
              required: [overdueCandidates, revisionRequiredJobs]
              properties:
                overdueCandidates: { $ref: '#/components/schemas/DashboardMetricValue' }
                revisionRequiredJobs: { $ref: '#/components/schemas/DashboardMetricValue' }
            recentCandidates:
              type: array
              items:
                type: object
                required: [applicationId, studentName, studentCode, gpa, jobTitle, status, lastTransitionAt]
                properties:
                  applicationId: { type: string, format: uuid }
                  studentName: { type: string }
                  studentCode: { type: string }
                  gpa: { type: [number, 'null'], minimum: 0, maximum: 4 }
                  jobTitle: { type: string }
                  status: { $ref: '#/components/schemas/ApplicationStatus' }
                  lastTransitionAt: { type: string, format: date-time }
            jobPerformance:
              type: array
              items:
                type: object
                required: [jobId, title, applications, forwarded, interviews, hires]
                properties:
                  jobId: { type: string, format: uuid }
                  title: { type: string }
                  applications: { $ref: '#/components/schemas/DashboardMetricValue' }
                  forwarded: { $ref: '#/components/schemas/DashboardMetricValue' }
                  interviews: { $ref: '#/components/schemas/DashboardMetricValue' }
                  hires: { $ref: '#/components/schemas/DashboardMetricValue' }
    Company:
      type: object
      required: [id, code, name, partnerStatus]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        legalName: { type: [string, 'null'] }
        taxCode: { type: [string, 'null'] }
        industry: { type: [string, 'null'] }
        companySize: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        website: { type: [string, 'null'], format: uri }
        address: { type: [string, 'null'] }
        partnerStatus: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, ENDED] }
        version: { type: integer, minimum: 1 }
        verifiedAt: { type: [string, 'null'], format: date-time }
        recruiterCount: { type: integer, minimum: 0 }
        activeRecruiterCount: { type: integer, minimum: 0 }
        recruitingJobCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PartnerDirectoryCompany:
      type: object
      required: [id, code, name, industry, companySize, description, website, address, verifiedAt, recruitingJobCount]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        industry: { type: [string, 'null'] }
        companySize: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        website: { type: [string, 'null'], format: uri }
        address: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        recruitingJobCount: { type: integer, minimum: 0 }
    PartnerDirectoryEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PartnerDirectoryCompany' }
    PartnerDirectoryListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PartnerDirectoryCompany' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    CompanyRecruiter:
      type: object
      required: [userId, email, fullName, isPrimary, status, createdAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        title: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        status: { $ref: '#/components/schemas/UserStatus' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    CompanyDetail:
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          required: [recruiters]
          properties:
            recruiters:
              type: array
              items: { $ref: '#/components/schemas/CompanyRecruiter' }
    CompanyCreateRequest:
      type: object
      required: [code, name, primaryRecruiter]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]+$' }
        name: { type: string, maxLength: 180 }
        legalName: { type: [string, 'null'], maxLength: 255 }
        taxCode: { type: [string, 'null'], maxLength: 50 }
        industry: { type: [string, 'null'], maxLength: 120 }
        companySize: { type: [string, 'null'], maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 5000 }
        website: { type: [string, 'null'], format: uri }
        address: { type: [string, 'null'], maxLength: 500 }
        primaryRecruiter: { $ref: '#/components/schemas/CompanyRecruiterRequest' }
    CompanyUpdateRequest:
      type: object
      required: [name, expectedVersion]
      properties:
        name: { type: string, maxLength: 180 }
        description: { type: [string, 'null'], maxLength: 5000 }
        website: { type: [string, 'null'], format: uri }
        address: { type: [string, 'null'], maxLength: 500 }
        industry: { type: [string, 'null'], maxLength: 120 }
        companySize: { type: [string, 'null'], maxLength: 80 }
        expectedVersion: { type: integer, minimum: 1 }
    CompanyAdminUpdateRequest:
      type: object
      required: [code, name, expectedVersion]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]+$' }
        name: { type: string, maxLength: 180 }
        legalName: { type: [string, 'null'], maxLength: 255 }
        taxCode: { type: [string, 'null'], maxLength: 50 }
        industry: { type: [string, 'null'], maxLength: 120 }
        companySize: { type: [string, 'null'], maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 5000 }
        website: { type: [string, 'null'], format: uri }
        address: { type: [string, 'null'], maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    CompanyRecruiterRequest:
      type: object
      required: [email, fullName]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, maxLength: 180 }
        title: { type: [string, 'null'], maxLength: 120 }
    CompanyStateChangeRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    ActivationToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string, minLength: 32 }
        expiresAt: { type: string, format: date-time }
    CompanyEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Company' }
    CompanyDetailEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CompanyDetail' }
    CompanyCreateResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [company, activation]
          properties:
            company: { $ref: '#/components/schemas/CompanyDetail' }
            activation: { $ref: '#/components/schemas/ActivationToken' }
    CompanyRecruiterCreateResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [userId, company, activation]
          properties:
            userId: { type: string, format: uuid }
            company: { $ref: '#/components/schemas/CompanyDetail' }
            activation: { $ref: '#/components/schemas/ActivationToken' }
    CompanyActivationResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [company, activation]
          properties:
            company: { $ref: '#/components/schemas/CompanyDetail' }
            activation: { $ref: '#/components/schemas/ActivationToken' }
    Job:
      type: object
      required: [id, company, title, opportunityType, workMode, location, description, requirements, positions, deadline, status, version, categories, skills, submittedAt, reviewedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        company: { $ref: '#/components/schemas/Company' }
        title: { type: string }
        opportunityType: { type: string, enum: [INTERNSHIP, PART_TIME, FULL_TIME, FRESHER] }
        workMode: { $ref: '#/components/schemas/WorkMode' }
        location: { type: string }
        description: { type: string }
        requirements: { type: string }
        benefits: { type: [string, 'null'] }
        positions: { type: integer, minimum: 1 }
        deadline: { type: string, format: date }
        status: { $ref: '#/components/schemas/JobStatus' }
        version: { type: integer, minimum: 1 }
        categories:
          type: array
          items:
            type: object
            required: [id, code, name]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
        skills:
          type: array
          items:
            type: object
            required: [id, slug, name, isRequired]
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              name: { type: string }
              isRequired: { type: boolean }
        latestReview:
          oneOf:
            - type: object
              required: [reasonCode, note, createdAt]
              properties:
                reasonCode: { type: string }
                note: { type: [string, 'null'] }
                createdAt: { type: string, format: date-time }
            - type: 'null'
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobDraftRequest:
      type: object
      required: [title, opportunityType, workMode, location, description, requirements, positions, deadline]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        opportunityType: { type: string, enum: [INTERNSHIP, PART_TIME, FULL_TIME, FRESHER] }
        workMode: { $ref: '#/components/schemas/WorkMode' }
        location: { type: string, maxLength: 300 }
        description: { type: string, maxLength: 10000 }
        requirements: { type: string, maxLength: 10000 }
        benefits: { type: string, maxLength: 5000 }
        positions: { type: integer, minimum: 1, maximum: 1000 }
        deadline: { type: string, format: date }
        categoryIds:
          type: array
          items: { type: string, format: uuid }
        skillIds:
          type: array
          items: { type: string, format: uuid }
    JobDraftUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/JobDraftRequest'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion:
              type: integer
              minimum: 1
              description: Phiên bản hiện tại dùng cho optimistic locking.
    JobEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Job' }
    JobListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ApplicationDocumentInput:
      type: object
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
    ApplicationSubmitRequest:
      type: object
      required: [jobId, documents, consentToShare]
      properties:
        jobId: { type: string, format: uuid }
        documents:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ApplicationDocumentInput' }
        consentToShare: { type: boolean, const: true }
    ApplicationResubmitRequest:
      type: object
      required: [documents, consentToShare]
      properties:
        documents:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/ApplicationDocumentInput' }
        consentToShare: { type: boolean, const: true }
    Application:
      type: object
      required: [id, studentProfileId, status, version, submittedAt, lastTransitionAt, availableActions, student, job, documents, recruitmentResult, timeline]
      properties:
        id: { type: string, format: uuid }
        studentProfileId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        version: { type: integer, minimum: 1 }
        submittedAt: { type: string, format: date-time }
        lastTransitionAt: { type: string, format: date-time }
        availableActions:
          type: array
          items:
            type: string
            enum: [RESUBMIT, WITHDRAW, CANCEL_INTERVIEW, ACCEPT_OFFER, DECLINE_OFFER]
        student:
          type: object
          required: [id, studentCode, fullName, faculty, major, cohort, gpa, academicStatus, email]
          properties:
            id: { type: string, format: uuid }
            studentCode: { type: string }
            fullName: { type: string }
            faculty: { type: string }
            major: { type: string }
            cohort: { type: string }
            gpa: { type: [number, 'null'], minimum: 0, maximum: 4 }
            academicStatus: { type: string, enum: [ACTIVE, SUSPENDED, GRADUATED, INACTIVE] }
            email: { type: string, format: email }
        job:
          type: object
          required: [id, title, opportunityType, workMode, location, deadline, company]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            opportunityType: { type: string, enum: [INTERNSHIP, PART_TIME, FULL_TIME, FRESHER] }
            workMode: { $ref: '#/components/schemas/WorkMode' }
            location: { type: string }
            deadline: { type: string, format: date }
            company:
              type: object
              required: [id, code, name]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [id, documentType, fileName, mimeType, fileSizeBytes, sourceVersion]
            properties:
              id: { type: string, format: uuid }
              sourceDocumentId: { type: [string, 'null'], format: uuid }
              documentType: { type: string, enum: [CV, TRANSCRIPT, STUDENT_CONFIRMATION, OTHER] }
              fileName: { type: string }
              mimeType: { type: string }
              fileSizeBytes: { type: integer, minimum: 1 }
              sourceVersion: { type: integer, minimum: 1 }
        recruitmentResult:
          oneOf:
            - $ref: '#/components/schemas/RecruitmentResult'
            - type: 'null'
        timeline:
          type: array
          items:
            type: object
            required: [fromStatus, toStatus, actorType, reasonCode, note, metadata, createdAt]
            properties:
              fromStatus:
                oneOf:
                  - $ref: '#/components/schemas/ApplicationStatus'
                  - type: 'null'
              toStatus: { $ref: '#/components/schemas/ApplicationStatus' }
              actorType: { type: string, enum: [STUDENT, UIT_ADMIN, COMPANY, SYSTEM] }
              reasonCode: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              metadata: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
    ApplicationEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Application' }
    ApplicationListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Application' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ReasonRequest:
      type: object
      required: [reasonCode, note]
      properties:
        reasonCode: { type: string, minLength: 2, maxLength: 100 }
        note: { type: string, minLength: 5, maxLength: 2000 }
    SupplementRequest:
      allOf:
        - $ref: '#/components/schemas/ReasonRequest'
        - type: object
          required: [requiredDocumentTypes, dueAt]
          properties:
            requiredDocumentTypes:
              type: array
              minItems: 1
              items: { type: string, enum: [CV, TRANSCRIPT, STUDENT_CONFIRMATION, OTHER] }
            dueAt: { type: string, format: date-time }
    InterviewRequest:
      type: object
      required: [scheduledAt, timeZone, mode, interviewerName]
      properties:
        scheduledAt: { type: string, format: date-time }
        timeZone: { type: string, default: Asia/Ho_Chi_Minh }
        mode: { type: string, enum: [ONSITE, ONLINE, PHONE] }
        location: { type: string, maxLength: 500 }
        meetingUrl: { type: string, format: uri }
        interviewerName: { type: string, maxLength: 150 }
    Interview:
      type: object
      required: [id, applicationId, scheduledAt, timeZone, mode, interviewerName, status, version]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        timeZone: { type: string }
        mode: { type: string, enum: [ONSITE, ONLINE, PHONE] }
        location: { type: [string, 'null'] }
        meetingUrl: { type: [string, 'null'], format: uri }
        interviewerName: { type: [string, 'null'] }
        status:
          type: string
          enum: [PENDING_STUDENT_CONFIRMATION, CONFIRMED, RESCHEDULE_REQUESTED, CANCELLED, COMPLETED, NO_SHOW]
        version: { type: integer, minimum: 1 }
    InterviewEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Interview' }
    InterviewListItem:
      allOf:
        - $ref: '#/components/schemas/Interview'
        - type: object
          required: [applicationStatus, student, job, recruitmentResult]
          properties:
            applicationStatus: { $ref: '#/components/schemas/ApplicationStatus' }
            student:
              type: object
              required: [id, studentCode, fullName, major, gpa]
              properties:
                id: { type: string, format: uuid }
                studentCode: { type: string }
                fullName: { type: string }
                major: { type: string }
                gpa: { type: [number, 'null'] }
            job:
              type: object
              required: [id, title, company]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                company:
                  type: object
                  required: [id, code, name]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }
            recruitmentResult:
              oneOf:
                - type: 'null'
                - type: object
                  required: [outcome, studentDecision]
                  properties:
                    outcome: { type: string, enum: [PASS, FAIL] }
                    studentDecision: { type: [string, 'null'], enum: [ACCEPTED, DECLINED, null] }
    InterviewListItemEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/InterviewListItem' }
    InterviewListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InterviewListItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    RecruitmentResultRequest:
      oneOf:
        - $ref: '#/components/schemas/RecruitmentPassRequest'
        - $ref: '#/components/schemas/RecruitmentFailRequest'
      discriminator:
        propertyName: outcome
        mapping:
          PASS: '#/components/schemas/RecruitmentPassRequest'
          FAIL: '#/components/schemas/RecruitmentFailRequest'
    RecruitmentPassRequest:
      type: object
      required: [outcome, startDate]
      properties:
        outcome: { type: string, const: PASS }
        startDate: { type: string, format: date }
        offerStorageKey: { type: string, minLength: 3, maxLength: 2000 }
        internalNote: { type: string, maxLength: 2000 }
    RecruitmentFailRequest:
      type: object
      required: [outcome, reasonCode, note]
      properties:
        outcome: { type: string, const: FAIL }
        reasonCode: { type: string, minLength: 2, maxLength: 80 }
        note: { type: string, minLength: 5, maxLength: 2000 }
    RecruitmentResult:
      type: object
      required: [id, outcome, studentDecision, offeredAt, respondedAt, startDate, offerStorageKey]
      properties:
        id: { type: string, format: uuid }
        outcome: { type: string, enum: [PASS, FAIL] }
        studentDecision:
          type: [string, 'null']
          enum: [ACCEPTED, DECLINED, null]
        offeredAt: { type: [string, 'null'], format: date-time }
        respondedAt: { type: [string, 'null'], format: date-time }
        startDate: { type: [string, 'null'], format: date }
        offerStorageKey: { type: [string, 'null'] }
    PlacementConfirmationRequest:
      type: object
      required: [startDate]
      properties:
        startDate: { type: string, format: date }
        note: { type: string, maxLength: 500 }
    Notification:
      type: object
      required: [id, type, title, body, resourceType, deepLink, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        resourceType: { type: string }
        resourceId: { type: [string, 'null'], format: uuid }
        deepLink: { type: string }
        payload:
          type: object
          additionalProperties: true
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        meta: { $ref: '#/components/schemas/PageMeta' }
