services:
  postgres:
    image: postgres:16-alpine
    container_name: uit-career-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uit_career_hub}
      POSTGRES_USER: ${POSTGRES_USER:-uit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uit_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uit_user} -d ${POSTGRES_DB:-uit_career_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

